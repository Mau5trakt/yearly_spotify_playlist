[project]
name = "yearly-spotify-playlist"
version = "0.1.0"
description = "Create one Spotify playlist per year based on when you liked each song"
readme = "README.md"
authors = [
    { name = "Enrique Alemany" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.4",
    "spotipy>=2.26.0",
    "tqdm>=4.70.1",
]

[project.scripts]
yearly-spotify-playlist = "yearly_spotify_playlist:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
